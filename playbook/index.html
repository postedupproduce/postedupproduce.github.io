const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='pu-playbook-pw';
async function open(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
 return new TextDecoder().decode(buf);
}
async function tryOpen(pw,quiet){
 const btn=document.getElementById('go'),err=document.getElementById('err');
 btn.disabled=true;btn.textContent='Opening…';
 try{const html=await open(pw);try{sessionStorage.setItem(KEY,pw)}catch(e){}document.open();document.write(html);document.close();}
 catch(e){btn.disabled=false;btn.textContent='Open the playbook';if(!quiet){err.textContent=window.crypto&&crypto.subtle?'That password didn’t work. Try again.':'This browser can’t open it. Try Safari or Chrome.';document.getElementById('pw').select();}}
}
document.getElementById('gate').addEventListener('submit',e=>{e.preventDefault();tryOpen(document.getElementById('pw').value,false);});
let saved=null;try{saved=sessionStorage.getItem(KEY)}catch(e){}
if(saved)tryOpen(saved,true);else document.getElementById('pw').focus();
}
</script>
